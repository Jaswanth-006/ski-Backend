# Local dev dependencies (Phase 0-B: Postgres; Phase 0-F: Redis + MinIO object storage).
# App services (api, worker) run from the repo image; for local dev run them via the venv
# (uvicorn / celery) or add services here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ski
      POSTGRES_PASSWORD: ski
      POSTGRES_DB: ski
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ski -d ski"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
