# Render Blueprint for the Ski API (Phase 7-E). Deploy: Render → New → Blueprint → this repo.
# Set the `sync: false` secrets in the dashboard (values in DEPLOYMENT.md). Postgres is external
# (Neon); the free web service sleeps after 15 min — keep it warm with a cron pinger on /livez.
services:
  - type: web
    name: ski-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /livez
    # Start command lives in the image CMD (Dockerfile): `alembic upgrade head && uvicorn …`.
    # Do NOT set dockerCommand here — Render mangles the `&&`, exiting 127.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql+asyncpg://…?sslmode=require)
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://ski.vercel.app
      - key: REDIS_URL
        sync: false # Upstash rediss://… (optional — throttle fails open without it)
      # First-login super_admin, created by the seed migration (idempotent).
      - key: SEED_ADMIN_NAME
        value: Sree Kamala Indane
      - key: SEED_ADMIN_PHONE
        value: "9440424797"
      - key: SEED_ADMIN_PASSWORD
        sync: false # set in the dashboard
