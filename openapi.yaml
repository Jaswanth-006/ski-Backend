openapi: 3.1.0
info:
  title: Ski — API
  description: System of record for an LPG distributorship. See 01-BACKEND-PRD.
  version: 0.1.0
paths:
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      operationId: refresh_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /v1/users:
    get:
      tags:
      - users
      summary: List Users
      operationId: list_users_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOut'
                title: Response List Users V1 Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - users
      summary: Create User
      operationId: create_user_v1_users_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/{user_id}:
    patch:
      tags:
      - users
      summary: Update User
      operationId: update_user_v1_users__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - users
      summary: Get User
      operationId: get_user_v1_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/cylinder-types:
    get:
      tags:
      - catalog
      summary: List Cylinder Types
      operationId: list_cylinder_types_v1_cylinder_types_get
      security:
      - HTTPBearer: []
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: string
          default: 'true'
          title: Active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CylinderTypeOut'
                title: Response List Cylinder Types V1 Cylinder Types Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catalog
      summary: Create Cylinder Type
      operationId: create_cylinder_type_v1_cylinder_types_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CylinderTypeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CylinderTypeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/cylinder-types/{type_id}:
    patch:
      tags:
      - catalog
      summary: Update Cylinder Type
      operationId: update_cylinder_type_v1_cylinder_types__type_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: type_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Type Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CylinderTypeUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CylinderTypeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/expense-items:
    get:
      tags:
      - catalog
      summary: List Expense Items
      operationId: list_expense_items_v1_expense_items_get
      security:
      - HTTPBearer: []
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: string
          default: 'true'
          title: Active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseItemOut'
                title: Response List Expense Items V1 Expense Items Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catalog
      summary: Create Expense Item
      operationId: create_expense_item_v1_expense_items_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseItemOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/expense-items/{item_id}:
    patch:
      tags:
      - catalog
      summary: Update Expense Item
      operationId: update_expense_item_v1_expense_items__item_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseItemOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/prices:
    get:
      tags:
      - pricing
      summary: Get Prices
      operationId: get_prices_v1_prices_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOut'
                title: Response Get Prices V1 Prices Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - pricing
      summary: Set Price
      operationId: set_price_v1_prices_put
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceSet'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/prices/bulk:
    put:
      tags:
      - pricing
      summary: Set Prices Bulk
      operationId: set_prices_bulk_v1_prices_bulk_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceBulkSet'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/inventory:
    get:
      tags:
      - stock
      summary: Get Inventory
      operationId: get_inventory_v1_inventory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InventoryOut'
                type: array
                title: Response Get Inventory V1 Inventory Get
      security:
      - HTTPBearer: []
  /v1/stock/intake:
    post:
      tags:
      - stock
      summary: Stock Intake
      operationId: stock_intake_v1_stock_intake_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockIntake'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InventoryOut'
                type: array
                title: Response Stock Intake V1 Stock Intake Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/jobs/ping:
    post:
      tags:
      - jobs
      summary: Enqueue Ping
      operationId: enqueue_ping_v1_jobs_ping_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnqueued'
      security:
      - HTTPBearer: []
  /v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: get_job_v1_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /livez:
    get:
      tags:
      - health
      summary: Livez
      description: 'Liveness: the process is up.'
      operationId: livez_livez_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Livez Livez Get
  /readyz:
    get:
      tags:
      - health
      summary: Readyz
      description: 'Readiness: the process can reach its database. 503 if not.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readyz Readyz Get
  /:
    get:
      tags:
      - meta
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    CylinderTypeCreate:
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 1
          title: Code
        label:
          type: string
          maxLength: 120
          minLength: 1
          title: Label
      type: object
      required:
      - code
      - label
      title: CylinderTypeCreate
    CylinderTypeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        code:
          type: string
          title: Code
        label:
          type: string
          title: Label
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - code
      - label
      - is_active
      title: CylinderTypeOut
    CylinderTypeUpdate:
      properties:
        label:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Label
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      type: object
      title: CylinderTypeUpdate
    ExpenseItemCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        category:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Category
      type: object
      required:
      - name
      title: ExpenseItemCreate
    ExpenseItemOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - name
      - category
      - is_active
      title: ExpenseItemOut
    ExpenseItemUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        category:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Category
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      type: object
      title: ExpenseItemUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InventoryOut:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        code:
          type: string
          title: Code
        label:
          type: string
          title: Label
        quantity:
          type: integer
          title: Quantity
        version:
          type: integer
          title: Version
      type: object
      required:
      - cylinder_type_id
      - code
      - label
      - quantity
      - version
      title: InventoryOut
    JobEnqueued:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        status:
          type: string
          title: Status
      type: object
      required:
      - job_id
      - status
      title: JobEnqueued
    JobOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          type: string
          title: Kind
        status:
          type: string
          title: Status
        result_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Url
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - kind
      - status
      - created_at
      - updated_at
      title: JobOut
    LoginRequest:
      properties:
        phone:
          type: string
          maxLength: 20
          minLength: 3
          title: Phone
        password:
          type: string
          maxLength: 200
          minLength: 1
          title: Password
      type: object
      required:
      - phone
      - password
      title: LoginRequest
    LogoutRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: LogoutRequest
    PriceBulkItem:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        unit_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Unit Price
      type: object
      required:
      - cylinder_type_id
      - unit_price
      title: PriceBulkItem
    PriceBulkSet:
      properties:
        effective_date:
          type: string
          format: date
          title: Effective Date
        prices:
          items:
            $ref: '#/components/schemas/PriceBulkItem'
          type: array
          minItems: 1
          title: Prices
      type: object
      required:
      - effective_date
      - prices
      title: PriceBulkSet
    PriceOut:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        code:
          type: string
          title: Code
        label:
          type: string
          title: Label
        unit_price:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Unit Price
        effective_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective Date
      type: object
      required:
      - cylinder_type_id
      - code
      - label
      - unit_price
      - effective_date
      title: PriceOut
      description: 'The effective price for one active cylinder type on the requested
        date

        (unit_price/effective_date are null when no price is set on/before that date).'
    PriceSet:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        unit_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Unit Price
        effective_date:
          type: string
          format: date
          title: Effective Date
      type: object
      required:
      - cylinder_type_id
      - unit_price
      - effective_date
      title: PriceSet
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    StockIntake:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/StockIntakeLine'
          type: array
          minItems: 1
          title: Lines
      type: object
      required:
      - lines
      title: StockIntake
    StockIntakeLine:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        qty:
          type: integer
          minimum: 1.0
          title: Qty
      type: object
      required:
      - cylinder_type_id
      - qty
      title: StockIntakeLine
    TokenPair:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      - refresh_token
      title: TokenPair
    UserCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        phone:
          type: string
          maxLength: 20
          minLength: 3
          title: Phone
        role:
          type: string
          title: Role
        password:
          type: string
          maxLength: 200
          minLength: 8
          title: Password
      type: object
      required:
      - name
      - phone
      - role
      - password
      title: UserCreate
    UserOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        role:
          type: string
          title: Role
        phone:
          type: string
          title: Phone
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - name
      - role
      - phone
      - is_active
      title: UserOut
    UserUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        password:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 8
          - type: 'null'
          title: Password
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
