components:
  schemas:
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Name
        action:
          type: string
          title: Action
        entity:
          type: string
          title: Entity
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        old_value:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Old Value
        new_value:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: New Value
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - actor_id
      - actor_name
      - action
      - entity
      - entity_id
      - old_value
      - new_value
      - created_at
      title: AuditOut
    CylinderTypeCreate:
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 1
          title: Code
        label:
          type: string
          maxLength: 120
          minLength: 1
          title: Label
      type: object
      required:
      - code
      - label
      title: CylinderTypeCreate
    CylinderTypeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
