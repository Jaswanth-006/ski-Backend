      - HTTPBearer: []
      parameters:
      - name: cylinder_type_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cylinder Type Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          description: current inventory version
          title: If-Match
        description: current inventory version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjust'
      responses:
        '200':
          description: Successful Response
