components:
  schemas:
    Ac4AccessoryLine:
      properties:
        accessory_id:
          type: string
          format: uuid
          title: Accessory Id
        qty:
          type: integer
          minimum: 1.0
          title: Qty
      type: object
      required:
      - accessory_id
      - qty
      title: Ac4AccessoryLine
    Ac4CylinderLine:
      properties:
        cylinder_type_id:
          type: string
          format: uuid
          title: Cylinder Type Id
        qty:
          type: integer
          minimum: 1.0
          title: Qty
      type: object
      required:
      - cylinder_type_id
      - qty
      title: Ac4CylinderLine
    Ac4Request:
      properties:
        business_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Business Date
        cylinders:
          items:
            $ref: '#/components/schemas/Ac4CylinderLine'
          type: array
          title: Cylinders
        accessories:
          items:
            $ref: '#/components/schemas/Ac4AccessoryLine'
          type: array
          title: Accessories
      type: object
      title: Ac4Request
      description: 'Stock received from the plant: full cylinders and/or accessories
        added to stock.'
    AccessoryCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: AccessoryCreate
    AccessoryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - name
      - is_active
      title: AccessoryOut
    AccessoryStockRow:
      properties:
        accessory_id:
          type: string
          format: uuid
          title: Accessory Id
        name:
          type: string
          title: Name
        opening:
          type: integer
          title: Opening
        received:
          type: integer
          title: Received
        sold:
          type: integer
          title: Sold
        closing:
          type: integer
          title: Closing
      type: object
      required:
      - accessory_id
      - name
      - opening
      - received
      - sold
      - closing
      title: AccessoryStockRow
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        actor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor Id
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Name
        action:
          type: string
          title: Action
        entity:
          type: string
          title: Entity
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        old_value:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Old Value
        new_value:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: New Value
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - actor_id
      - actor_name
      - action
      - entity
      - entity_id
      - old_value
      - new_value
      - created_at
      title: AuditOut
    BankAccountCreate:
      properties:
        bank_id:
          type: string
          format: uuid
          title: Bank Id
        account_type:
          type: string
          maxLength: 60
          minLength: 1
          title: Account Type
        label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Label
      type: object
      required:
      - bank_id
      - account_type
      title: BankAccountCreate
    BankAccountOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        bank_id:
          type: string
          format: uuid
          title: Bank Id
        bank_name:
          type: string
          title: Bank Name
        account_type:
          type: string
          title: Account Type
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        is_active:
          type: boolean
          title: Is Active
        balance:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Balance
      type: object
      required:
      - id
      - bank_id
      - bank_name
      - account_type
      - label
      - is_active
      - balance
      title: BankAccountOut
    BankAccountUpdate:
      properties:
        account_type:
          anyOf:
          - type: string
            maxLength: 60
            minLength: 1
          - type: 'null'
          title: Account Type
        label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Label
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      type: object
      title: BankAccountUpdate
    BankCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: BankCreate
    BankOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - name
      - is_active
      title: BankOut
    BankUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      type: object
      title: BankUpdate
    CashierBoxOut:
      properties:
        business_date:
          type: string
          format: date
          title: Business Date
        opening:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Opening
        collected:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Collected
        expenses:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Expenses
        deposited:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Deposited
        closing:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Closing
      type: object
      required:
