name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ski
          POSTGRES_PASSWORD: ski
          POSTGRES_DB: ski
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ski -d ski"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ski:ski@localhost:5432/ski
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy

      - name: Prepare database schema
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest

  migrations:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ski
          POSTGRES_PASSWORD: ski
          POSTGRES_DB: ski
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ski -d ski"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ski:ski@localhost:5432/ski
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Run migrations on a clean DB
        run: alembic upgrade head
      - name: Verify migrations are reversible
        run: alembic downgrade base

  build:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ski-backend:ci .

  deploy-dev:
    name: deploy (dev)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      # Wire to your host (Render / Fly.io) once DEV_DEPLOY_HOOK is set in repo secrets.
      # Until then this step is a no-op so `main` stays green. See README "Deploy".
      - name: Trigger dev deploy
        env:
          DEV_DEPLOY_HOOK: ${{ secrets.DEV_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEV_DEPLOY_HOOK" ]; then
            echo "DEV_DEPLOY_HOOK not set — skipping deploy (configure in repo secrets)."
            exit 0
          fi
          curl -fsSL -X POST "$DEV_DEPLOY_HOOK"
          echo "Dev deploy triggered."
